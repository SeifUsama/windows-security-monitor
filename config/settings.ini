[monitoring]
# How often to poll for new events (seconds)
interval_seconds = 30

# Maximum events to fetch per collection cycle per source
max_events_per_cycle = 500

[detection]
# Brute Force Rule: minimum failed logins to trigger
brute_force_threshold = 5

# Brute Force Rule: time window in seconds
brute_force_window_seconds = 60

# Port Scan Rule: minimum unique destination ports to trigger
port_scan_threshold = 10

# Port Scan Rule: time window in seconds
port_scan_window_seconds = 30

[log_sources]
# Enable/disable each log source (true/false)
security_log = true
system_log = true
application_log = true
powershell_log = true
firewall_log = true

[database]
# Path to SQLite database file
db_path = security_monitor.db

[firewall]
# Path to Windows Firewall log file
log_path = C:\Windows\System32\LogFiles\Firewall\pfirewall.log

[ui]
# Theme: dark or light
theme = dark

# Color accent: blue, green, dark-blue
color_theme = blue

# Default page on startup: dashboard, live_monitor, incidents, search, config
default_page = dashboard

[file_integrity]
enabled = true
# Comma-separated list of path substrings to monitor (e.g. system32\drivers\etc, hosts, windows-security-monitor)
# Keep empty to watch all accessed/modified files logged by Windows
watch_paths = system32\drivers\etc, hosts, windows-security-monitor
# Severity of the generated incident: LOW, MEDIUM, HIGH, CRITICAL
alert_severity = LOW
